<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>사랑하게 될 거야 - 실시간 기타 연주 평가</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #121212; color: #ffffff; font-family: 'Pretendard', sans-serif; display: flex; flex-direction: column; height: 100vh; padding: 20px; }
        header { text-align: center; margin-bottom: 20px; }
        header h1 { font-size: 1.8rem; color: #00ffcc; }

        .container { display: flex; flex: 1; gap: 20px; max-width: 1400px; width: 100%; margin: 0 auto; }
        
        .left-panel { flex: 6; background: #1e1e1e; border-radius: 12px; padding: 15px; display: flex; flex-direction: column; position: relative; }
        .video-wrapper { position: relative; width: 100%; height: 100%; min-height: 400px; background: #000; border-radius: 8px; overflow: hidden; display: flex; justify-content: center; align-items: center; }
        video { width: 100%; height: 100%; object-fit: contain; }

        .countdown-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: none; justify-content: center; align-items: center; font-size: 8rem; font-weight: bold; color: #00ffcc; z-index: 10; }

        .right-panel { flex: 4; background: #1e1e1e; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; justify-content: space-between; }
        .score-board { background: #2a2a2a; padding: 20px; border-radius: 8px; text-align: center; margin-bottom: 15px; }
        .score-title { font-size: 1.1rem; color: #bbb; margin-bottom: 10px; }
        .score-value { font-size: 3.5rem; font-weight: bold; color: #00ffcc; }
        .pass-status { font-size: 1.2rem; margin-top: 10px; font-weight: bold; }
        
        .realtime-info { background: #252525; padding: 15px; border-radius: 8px; flex: 1; margin-bottom: 15px; display: flex; flex-direction: column; gap: 10px; justify-content: center; }
        .metric-box { display: flex; justify-content: space-between; align-items: center; font-size: 1.1rem; }
        .accuracy-bar-container { width: 100%; background: #444; height: 15px; border-radius: 8px; overflow: hidden; margin-top: 5px; }
        .accuracy-bar { width: 0%; height: 100%; background: #ff4757; transition: width 0.1s ease, background-color 0.2s; }

        .btn-group { display: flex; gap: 10px; }
        .btn { flex: 1; border: none; padding: 18px; font-size: 1.2rem; font-weight: bold; border-radius: 8px; cursor: pointer; transition: 0.2s; }
        .btn-start { background: #00ffcc; color: #000; }
        .btn-start:hover { background: #00dda9; }
        .btn-pause { background: #ffa500; color: #000; }
        .btn-pause:hover { background: #e09200; }
        .btn:disabled { background: #555; color: #888; cursor: not-allowed; }
    </style>
</head>
<body>

    <header>
        <h1>🎸 「사랑하게 될 거야」 실시간 기타 연주 평가 System</h1>
    </header>

    <div class="container">
        <div class="left-panel">
            <div class="video-wrapper">
                <video id="guitarVideo" crossorigin="anonymous">
                    <source src="{{ url_for('static', filename='guitar.mp4') }}" type="video/mp4">
                    브라우저가 비디오 태그를 지원하지 않습니다.
                </video>
                <div id="countdown" class="countdown-overlay">3</div>
            </div>
        </div>

        <div class="right-panel">
            <div class="score-board">
                <div class="score-title">누적 획득 점수 (기본 4점 포함 / 만점 30점)</div>
                <div id="scoreText" class="score-value">4 / 30 점</div>
                <div id="passStatus" class="pass-status" style="color: #aaa;">연주 대기 중</div>
            </div>

            <div class="realtime-info">
                <div class="metric-box">
                    <span>실시간 기타 연주 일치도</span>
                    <span id="accuracyText" style="font-weight: bold; color: #ff4757;">0%</span>
                </div>
                <div class="accuracy-bar-container">
                    <div id="accuracyBar" class="accuracy-bar"></div>
                </div>
                <p style="font-size: 0.85rem; color: #888; margin-top: 10px; text-align: center;">
                    * 🎸 기타 소리를 직접 인식합니다. 70% 이상 일치 시 1초당 1점 추가됩니다.
                </p>
            </div>

            <div class="btn-group">
                <button id="startBtn" class="btn btn-start" onclick="startEvaluation()">시작하기</button>
                <button id="pauseBtn" class="btn btn-pause" onclick="togglePause()" disabled>일시정지</button>
            </div>
        </div>
    </div>

    <script>
        let video = document.getElementById('guitarVideo');
        let countdownOverlay = document.getElementById('countdown');
        let startBtn = document.getElementById('startBtn');
        let pauseBtn = document.getElementById('pauseBtn');
        let scoreText = document.getElementById('scoreText');
        let accuracyText = document.getElementById('accuracyText');
        let accuracyBar = document.getElementById('accuracyBar');
        let passStatus = document.getElementById('passStatus');

        let audioCtx, micStream, micAnalyser, videoAnalyser;
        let isEvaluating = false;
        let isPaused = false;
        let countdownTimer = null;
        
        const BASE_SCORE = 4;
        const MAX_SCORE = 30;
        let score = BASE_SCORE;
        let scoreTimer = null;
        let currentAccuracy = 0;

        const MAX_TIME = 65; // 1분 5초

        async function startEvaluation() {
            startBtn.disabled = true;
            pauseBtn.disabled = false;
            pauseBtn.innerText = "일시정지";
            isPaused = false;

            score = BASE_SCORE;
            scoreText.innerText = `${score} / ${MAX_SCORE} 점`;
            passStatus.innerText = "카운트다운 시작...";
            passStatus.style.color = "#00ffcc";

            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    
                    // 핵심 수정: 브라우저의 소음제거/목소리 전용 필터를 모두 해제하여 기타 소리 수음
                    micStream = await navigator.mediaDevices.getUserMedia({
                        audio: {
                            echoCancellation: false,
                            noiseSuppression: false,
                            autoGainControl: false
                        }
                    });
                    
                    let micSource = audioCtx.createMediaStreamSource(micStream);
                    micAnalyser = audioCtx.createAnalyser();
                    micAnalyser.fftSize = 1024;
                    micSource.connect(micAnalyser);

                    let videoSource = audioCtx.createMediaElementSource(video);
                    videoAnalyser = audioCtx.createAnalyser();
                    videoAnalyser.fftSize = 1024;
                    videoSource.connect(videoAnalyser);
                    videoSource.connect(audioCtx.destination);
                }
            } catch (e) {
                alert("마이크 접근 권한이 필요하거나 오디오 설정에 실패했습니다.");
                startBtn.disabled = false;
                pauseBtn.disabled = true;
                return;
            }

            video.currentTime = 0;
            countdownOverlay.style.display = 'flex';
            let count = 3;
            countdownOverlay.innerText = count;

            countdownTimer = setInterval(() => {
                if (isPaused) return;

                count--;
                if (count > 0) {
                    countdownOverlay.innerText = count;
                } else {
                    clearInterval(countdownTimer);
                    countdownOverlay.style.display = 'none';
                    runVideoAndEval();
                }
            }, 1000);
        }

        function runVideoAndEval() {
            video.play();
            isEvaluating = true;
            passStatus.innerText = "실시간 채점 진행 중...";

            scoreTimer = setInterval(() => {
                if (isEvaluating && !isPaused) {
                    if (video.currentTime >= MAX_TIME || video.ended) {
                        stopEvaluation();
                        return;
                    }

                    if (currentAccuracy >= 70 && score < MAX_SCORE) {
                        score++;
                        scoreText.innerText = `${score} / ${MAX_SCORE} 점`;
                    }
                }
            }, 1000);

            requestAnimationFrame(analyzeAudio);
        }

        function togglePause() {
            if (!isEvaluating && countdownOverlay.style.display === 'none') return;

            isPaused = !isPaused;

            if (isPaused) {
                video.pause();
                pauseBtn.innerText = "재개하기";
                passStatus.innerText = "일시정지 됨";
                passStatus.style.color = "#ff4757";
            } else {
                if (countdownOverlay.style.display === 'none') {
                    video.play();
                    passStatus.innerText = "실시간 채점 진행 중...";
                    passStatus.style.color = "#00ffcc";
                    requestAnimationFrame(analyzeAudio);
                } else {
                    passStatus.innerText = "카운트다운 재개...";
                    passStatus.style.color = "#00ffcc";
                }
                pauseBtn.innerText = "일시정지";
            }
        }

        function analyzeAudio() {
            if (!isEvaluating || isPaused) return;

            let micData = new Uint8Array(micAnalyser.frequencyBinCount);
            let videoData = new Uint8Array(videoAnalyser.frequencyBinCount);

            micAnalyser.getByteFrequencyData(micData);
            videoAnalyser.getByteFrequencyData(videoData);

            // 기타 음역대 주파수 대역 집중 분석 (약 80Hz ~ 1200Hz 구간 인덱스)
            let startBin = Math.floor(80 / (audioCtx.sampleRate / 1024));
            let endBin = Math.floor(1200 / (audioCtx.sampleRate / 1024));

            let micEnergy = 0;
            let videoEnergy = 0;
            let matchScore = 0;
            let activeBins = 0;

            for (let i = startBin; i <= endBin; i++) {
                micEnergy += micData[i];
                videoEnergy += videoData[i];

                if (videoData[i] > 20) { // 비디오에서 연주 소리가 출력 중일 때
                    activeBins++;
                    let diff = Math.abs(micData[i] - videoData[i]);
                    if (diff < 50) {
                        matchScore++;
                    }
                }
            }

            let avgMicEnergy = micEnergy / (endBin - startBin);

            // 기타 소리가 마이크로 일정 이상 들어오지 않는 경우 (무음/미연주)
            if (avgMicEnergy < 12) {
                currentAccuracy = 0;
            } else {
                if (activeBins > 0) {
                    currentAccuracy = Math.min(100, Math.round((matchScore / activeBins) * 110));
                } else {
                    currentAccuracy = 60;
                }
            }

            accuracyText.innerText = currentAccuracy + "%";
            accuracyBar.style.width = currentAccuracy + "%";

            if (currentAccuracy >= 70) {
                accuracyBar.style.backgroundColor = "#00ffcc";
                accuracyText.style.color = "#00ffcc";
            } else {
                accuracyBar.style.backgroundColor = "#ff4757";
                accuracyText.style.color = "#ff4757";
            }

            requestAnimationFrame(analyzeAudio);
        }

        function stopEvaluation() {
            isEvaluating = false;
            video.pause();
            clearInterval(scoreTimer);
            clearInterval(countdownTimer);

            passStatus.innerText = `채점 종료! 최종 점수: ${score} / ${MAX_SCORE}점`;
            passStatus.style.color = "#00ffcc";
            startBtn.disabled = false;
            pauseBtn.disabled = true;
        }
    </script>
</body>
</html>
